# ==============================
# Application
# ==============================
spring.application.name=employee-management-system
server.port=8080

# ==============================
# Datasource (MySQL 8)
# ==============================
spring.datasource.url=jdbc:mysql://localhost:3306/employee_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ==============================
# CORS (for React dev server)
# ==============================
app.cors.allowed-origins=http://localhost:3000

# ==============================
# JWT (bonus: authentication)
# ==============================
# 256-bit+ secret used to sign tokens. Override with the JWT_SECRET env var in real deployments.
app.jwt.secret=${JWT_SECRET:c2VjdXJlLWVtcGxveWVlLW1hbmFnZW1lbnQtc3lzdGVtLWp3dC1zaWduaW5nLWtleS1jaGFuZ2UtbWU=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==============================
# Bonus admin login (demo credentials — change/remove for production)
# ==============================
app.auth.admin-username=${ADMIN_USERNAME:admin}
app.auth.admin-password=${ADMIN_PASSWORD:admin123}
